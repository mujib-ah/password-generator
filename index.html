<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="ind.css">
</head>
<body>
    <main>
        <h1>Password Generator</h1>

        <p class="desc">Generate a secure random password</p>

        <label for="input">Password Length</label>
        <input type="number"
               min="4"
               max="20"
               id="input"
               placeholder="Enter Lenght (4-20)">

               <button id="btn">Generate Password</button>


               <p id="show"></p>

                <div class="result">
               <input type="text"
                      readonly
                      placeholder="Your Password will appear here"
                      id="output">
                      </div>
                    
    </main>
    <script src="ind.js"></script>
</body>
</html>
